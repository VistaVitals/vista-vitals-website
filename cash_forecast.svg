<svg width="358" height="248" viewBox="0 0 358 248" xmlns="http://www.w3.org/2000/svg">
  <style>
    .gray { fill:#8A93A0; font-family:'DejaVu Sans',Arial,sans-serif; }
    .navy { fill:#1B2A4A; font-family:'DejaVu Sans',Arial,sans-serif; }
    .slate { fill:#33414F; font-family:'DejaVu Sans',Arial,sans-serif; }
    .num { fill:#33414F; font-family:'DejaVu Sans',Arial,sans-serif; }
    .mono { fill:#3A8FAD; font-family:'DejaVu Sans Mono',monospace; letter-spacing:1.4px; }
    .monohd { fill:#3A8FAD; font-family:'DejaVu Sans Mono',monospace; letter-spacing:1px; }
  </style>

  <rect width="358" height="248" fill="#FFFFFF"/>

  <!-- Card -->
  <rect x="8" y="0" width="342" height="240" rx="14" fill="#EDF2F6"/>

  <!-- Section label -->
  <text x="30" y="34" class="mono" font-size="11" font-weight="700">ROLLING 3-MONTH CASH FORECAST</text>

  <!-- Column headers -->
  <text x="238" y="58" class="monohd" font-size="10" font-weight="700" text-anchor="end">JUN</text>
  <text x="286" y="58" class="monohd" font-size="10" font-weight="700" text-anchor="end">JUL</text>
  <text x="334" y="58" class="monohd" font-size="10" font-weight="700" text-anchor="end">AUG</text>
  <line x1="30" y1="66" x2="334" y2="66" stroke="#DCE4EC" stroke-width="1.2"/>

  <!-- Beginning cash -->
  <text x="30" y="86" class="slate" font-size="12">Beginning cash</text>
  <text x="238" y="86" class="num" font-size="12" text-anchor="end">$142K</text>
  <text x="286" y="86" class="num" font-size="12" text-anchor="end">$168K</text>
  <text x="334" y="86" class="num" font-size="12" text-anchor="end">$114K</text>

  <!-- Cash in -->
  <text x="30" y="110" class="slate" font-size="12">Cash in</text>
  <text x="238" y="110" class="num" font-size="12" text-anchor="end">+$64K</text>
  <text x="286" y="110" class="num" font-size="12" text-anchor="end">+$41K</text>
  <text x="334" y="110" class="num" font-size="12" text-anchor="end">+$58K</text>

  <!-- Cash out -->
  <text x="30" y="134" class="slate" font-size="12">Cash out</text>
  <text x="238" y="134" class="num" font-size="12" text-anchor="end">−$38K</text>
  <text x="286" y="134" class="num" font-size="12" text-anchor="end">−$95K</text>
  <text x="334" y="134" class="num" font-size="12" text-anchor="end">−$36K</text>

  <!-- Net change -->
  <text x="30" y="158" class="slate" font-size="12">Net change</text>
  <text x="238" y="158" fill="#4A9A52" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end">+$26K</text>
  <text x="286" y="158" fill="#C7544E" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end">−$54K</text>
  <text x="334" y="158" fill="#4A9A52" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end">+$22K</text>

  <!-- Ending cash -->
  <line x1="30" y1="170" x2="334" y2="170" stroke="#DCE4EC" stroke-width="1.2"/>
  <text x="30" y="192" class="navy" font-size="12" font-weight="700">Ending cash</text>
  <text x="238" y="192" class="navy" font-size="12" font-weight="700" text-anchor="end">$168K</text>
  <text x="286" y="192" fill="#B9821F" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end">$114K</text>
  <text x="334" y="192" class="navy" font-size="12" font-weight="700" text-anchor="end">$136K</text>

  <!-- Summary row -->
  <line x1="30" y1="206" x2="334" y2="206" stroke="#DCE4EC" stroke-width="1"/>
  <text x="30" y="230" class="slate" font-size="12">Lowest projected balance</text>
  <rect x="276" y="216" width="58" height="20" rx="10" fill="#FBE8C9"/>
  <text x="305" y="230" fill="#B9821F" font-size="10" font-weight="700" font-family="'DejaVu Sans',Arial,sans-serif" text-anchor="middle">WATCH</text>
</svg>
